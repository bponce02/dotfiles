    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-11"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-11".settings]
