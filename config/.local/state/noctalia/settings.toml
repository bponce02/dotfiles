config_version = 16

[bar.default]
auto_hide = true
reserve_space = false
show_on_workspace_switch = false

[dock]
launcher_position = "start"
layer = "overlay"
reserve_space = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-14",
    "lockscreen-login-box@DP-12",
    "lockscreen-login-box@DP-8",
    "lockscreen-login-box@DP-11",
